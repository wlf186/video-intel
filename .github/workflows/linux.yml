name: Linux quality gates
permissions:
  contents: read
concurrency:
  group: linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
    - name: Install pinned tools and lightweight test environment
      run: 'python3 scripts/bootstrap_tools.py all

        .runtime/bin/uv venv --python "$(cat .python-version)" .runtime/ci

        python3 scripts/sync_environment.py --ci --python "$PWD/.runtime/ci/bin/python"

        ./scripts/pnpm.sh install --frozen-lockfile

        '
    - name: Verify dependency locks and upstream provenance
      run: "python3 scripts/lock_dependencies.py --check\npython3 - <<'PY'\nimport\
        \ hashlib, json, urllib.request\nfrom pathlib import Path\ncommit = json.loads(Path('scripts/toolchain.json').read_text())['comfyui_commit']\n\
        with urllib.request.urlopen(f'https://raw.githubusercontent.com/Comfy-Org/ComfyUI/{commit}/requirements.txt',\
        \ timeout=30) as response:\n    upstream = response.read()\nsnapshot = Path('requirements-comfy.in').read_bytes().splitlines(keepends=True)\n\
        assert upstream == b''.join(snapshot[2:]), hashlib.sha256(upstream).hexdigest()\n\
        PY\n"
    - name: Backend tests and lint
      run: '.runtime/ci/bin/python -m pytest tests -q

        .runtime/ci/bin/ruff check video_intel tests scripts

        '
    - name: Frontend build and security regressions
      run: './scripts/pnpm.sh build

        ./scripts/pnpm.sh test:security

        git diff --exit-code

        '
    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-backend-evidence
        path: 'tmp/dependency-audit.json

          ${{ runner.temp }}/browser-smoke

          '
        if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
    - name: Install pinned tools and lightweight test environment
      run: 'python3 scripts/bootstrap_tools.py all

        .runtime/bin/uv venv --python "$(cat .python-version)" .runtime/ci

        python3 scripts/sync_environment.py --ci --python "$PWD/.runtime/ci/bin/python"

        ./scripts/pnpm.sh install --frozen-lockfile

        '
    - name: Verify dependency locks and upstream provenance
      run: "python3 scripts/lock_dependencies.py --check\npython3 - <<'PY'\nimport\
        \ hashlib, json, urllib.request\nfrom pathlib import Path\ncommit = json.loads(Path('scripts/toolchain.json').read_text())['comfyui_commit']\n\
        with urllib.request.urlopen(f'https://raw.githubusercontent.com/Comfy-Org/ComfyUI/{commit}/requirements.txt',\
        \ timeout=30) as response:\n    upstream = response.read()\nsnapshot = Path('requirements-comfy.in').read_bytes().splitlines(keepends=True)\n\
        assert upstream == b''.join(snapshot[2:]), hashlib.sha256(upstream).hexdigest()\n\
        PY\n"
    - name: Browser smoke without GPU or model downloads
      run: '.runtime/ci/bin/python -m playwright install --with-deps chromium

        .runtime/ci/bin/python scripts/browser_smoke.py --output "$RUNNER_TEMP/browser-smoke"

        '
    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-browser-evidence
        path: 'tmp/dependency-audit.json

          ${{ runner.temp }}/browser-smoke

          '
        if-no-files-found: ignore
  linux:
    needs:
    - backend
    - browser
    - security
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every check to pass
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        CHECK_RESULTS: ${{ toJSON(needs) }}
      with:
        script: "const results = JSON.parse(process.env.CHECK_RESULTS)\nfor (const\
          \ name of ['backend', 'browser', 'security']) {\n  if (results[name]?.result\
          \ !== 'success') {\n    core.setFailed(`${name}: ${results[name]?.result\
          \ ?? 'missing'}`)\n  }\n}\n"
  security:
    uses: ./.github/workflows/dependency-security.yml
    permissions:
      contents: read
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  schedule:
  - cron: 43 4 1 * *
  workflow_dispatch: null
