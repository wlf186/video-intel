name: Linux quality gates

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.runtime/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned tools and lightweight test environment
        run: |
          python3 scripts/bootstrap_tools.py all
          .runtime/bin/uv venv --python "$(cat .python-version)" .runtime/ci
          python3 scripts/sync_environment.py --ci --python "$PWD/.runtime/ci/bin/python"
          ./scripts/pnpm.sh install --frozen-lockfile
      - name: Verify dependency locks and upstream provenance
        run: |
          python3 scripts/lock_dependencies.py --check
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          commit = json.loads(Path('scripts/toolchain.json').read_text())['comfyui_commit']
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/Comfy-Org/ComfyUI/{commit}/requirements.txt', timeout=30) as response:
              upstream = response.read()
          snapshot = Path('requirements-comfy.in').read_bytes().splitlines(keepends=True)
          assert upstream == b''.join(snapshot[2:]), hashlib.sha256(upstream).hexdigest()
          PY
      - name: Backend tests and lint
        run: |
          .runtime/ci/bin/python -m pytest tests -q
          .runtime/ci/bin/ruff check video_intel tests scripts
      - name: Frontend build and security regressions
        run: |
          ./scripts/pnpm.sh build
          ./scripts/pnpm.sh test:security
          git diff --exit-code
      - name: Audit all locks and tool versions
        run: .runtime/ci/bin/python scripts/audit_dependencies.py
      - name: Browser smoke without GPU or model downloads
        run: |
          .runtime/ci/bin/python -m playwright install --with-deps chromium
          .runtime/ci/bin/python scripts/browser_smoke.py --output "$RUNNER_TEMP/browser-smoke"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-validation
          path: |
            tmp/dependency-audit.json
            ${{ runner.temp }}/browser-smoke
          if-no-files-found: ignore
